name: Keep Render backend warm

# Ping backend mỗi 10 phút trong khung 18h tối - 6h sáng giờ VN (UTC+7),
# tức 11h-23h UTC — để tránh Render free tier tự ngủ đúng lúc cần demo.
# ~13h/ngày * 30 ngày ≈ 390 giờ/tháng, an toàn dưới mức free 750 giờ/tháng.
on:
  schedule:
    - cron: "*/10 11-23 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 30 https://giupay.onrender.com/health
